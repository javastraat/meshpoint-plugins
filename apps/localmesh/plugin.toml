name = "localmesh"
version = "0.2.0"
meshpoint_api = 1
provides = ["capture", "protocol", "routes", "sidebar", "topbar"]

[frontend]
scripts = [
    "frontend/localmesh_settings_tab.js",
    "frontend/localmesh_panel.js",
    "frontend/localmesh_topbar_chip.js",
]

[sidebar]
route = "localmesh"
label = "LocalMesh"
category = "networks"
icon = "antenna"

[meta]
description = "LocalMesh receiver (Heltec V4, companion firmware) on USB serial: every packet it hears in the packet log under protocol localmesh (type, member, hops, path, signal, decision), a topbar chip with connection, node and battery, and the LocalMesh page (Receiver and Settings tabs). Read-only. LocalMesh uses 62.5 kHz, which the SX1302 cannot receive."
homepage = "https://www.localmesh.nl"
author = "Einstein PD2EMC"
