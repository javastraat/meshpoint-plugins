name = "localmesh"
version = "0.1.1"
meshpoint_api = 1
provides = ["capture", "protocol", "routes", "sidebar", "topbar"]

[frontend]
scripts = [
    "frontend/localmesh_settings_tab.js",
    "frontend/localmesh_member_drawer.js",
    "frontend/localmesh_send_tab.js",
    "frontend/localmesh_panel.js",
    "frontend/localmesh_topbar_chip.js",
]
styles = ["frontend/localmesh.css"]

[sidebar]
route = "localmesh"
label = "LocalMesh"
category = "networks"
icon = "zap"         # the bolt of the LocalMesh logo (plugins pick from the core's icon list)

[meta]
description = "LocalMesh receiver (Heltec V4, companion firmware) on USB serial: every packet it hears in the packet log under protocol localmesh (type, member, hops, path, signal, decision), a topbar chip with connection, node and frequency, and the LocalMesh page (Members, Messages, Activity, Send, Receiver and Settings tabs). Sends only from the Send tab (admin). LocalMesh uses 62.5 kHz, which the SX1302 cannot receive."
homepage = "https://www.localmesh.nl"
author = "Einstein PD2EMC"
