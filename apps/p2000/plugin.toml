name = "p2000"
version = "1.0.0"
meshpoint_api = 1
provides = ["listener", "routes", "hook"]

[deps]
setup = "setup.sh"
check = "check.sh"

[frontend]
scripts = ["frontend/p2000_panel.js"]

[hook]
host = "rtlsdr"    # lives on the rtlsdr plugin's page, not the built-in
                    # Listener page -- see plugins/apps/rtlsdr/README.md

[meta]
description = "Dutch emergency dispatch (P2000, FLEX on 169.65 MHz) decoding via rtl_fm + multimon-ng"
homepage = "https://github.com/EliasOenal/multimon-ng"
author = "Einstein PD2EMC"
