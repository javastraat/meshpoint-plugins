name = "oled-display"
version = "0.1.0"
meshpoint_api = 1
provides = ["service", "routes", "sidebar"]

[deps]
setup = "setup.sh"
check = "check.sh"

[frontend]
scripts = ["frontend/oled_display_panel.js"]
styles = ["frontend/oled_display_panel.css"]

[sidebar]
route = "oled-display"
label = "OLED Display"
category = "configuration"
icon = "gear"

[meta]
description = "Drives a small I2C status OLED (SSD1306-family) with a boot logo then live device status -- IP address, which capture sources are actually running, uptime. Auto-blanks after a configurable timeout to avoid burn-in. Settings page shows a live preview of exactly what's on the physical screen."
homepage = "https://github.com/javastraat/meshpoint-plugins"
author = "Einstein PD2EMC"
