name = "bluetooth-scanner"
version = "0.2.1"
meshpoint_api = 1
provides = ["listener", "routes", "sidebar"]

[deps]
apt = ["bluez", "pi-bluetooth", "raspberrypi-sys-mods", "wireless-regdb"]
setup = "setup.sh"
check = "check.sh"

[frontend]
scripts = ["frontend/bluetooth_scanner.js"]
styles = ["frontend/bluetooth_scanner.css"]

[sidebar]
route = "bluetooth-scanner"
label = "Bluetooth Scanner"
category = "networks"
icon = "antenna"

[meta]
description = "Generic nearby-BLE-device radar: Start/Stop scan, live sortable table of every advertising Bluetooth LE device in range (address, name, vendor, RSSI, last seen), with manufacturer, services and address type per device from an offline vendor database."
homepage = "https://github.com/javastraat/meshpoint-plugins"
author = "Einstein PD2EMC"
